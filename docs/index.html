document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0px 700px at 50% -10%,#1d2340 0%,#101018 60%);color:#f2f2f5;font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 20px 40px;box-sizing:border-box\">\n\n<div style=\"width:100%;max-width:1000px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px\">\n<div style=\"display:flex;align-items:center;gap:12px\">\n<div style=\"width:34px;height:34px;border-radius:9px;background:oklch(0.72 0.16 55);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#1a1408;font-size:17px\">A<\u002Fdiv>\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.2px\">Anlagenmechaniker Quizapp<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:8px 14px;border-radius:999px\">\n<span style=\"opacity:.55;font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase\">Punkte<\u002Fspan><span>{{ score }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isJoin }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"width:100%;max-width:1000px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start\">\n<div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:34px 32px\">\n<div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:10px\">Anlagenmechaniker SHK<\u002Fdiv>\n<h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:38px;line-height:1.08;margin:0 0 14px;letter-spacing:-.8px;text-wrap:pretty\">Wiederholungsfragen Lernfeld 1–15<\u002Fh1>\n<p style=\"margin:0 0 22px;font-size:16px;line-height:1.55;color:rgba(242,242,245,.72);max-width:52ch;text-wrap:pretty\">Lernfeld wählen, dann {{ wanted }} Fragen daraus. Vier Antworten, eine ist richtig. Je schneller du antwortest, desto mehr Punkte — mit Serien-Bonus.<\u002Fp>\n\n<div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:10px\">Lernfeld wählen<\u002Fdiv>\n<sc-if value=\"{{ dataWaiting }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:20px;font-size:14px;color:rgba(242,242,245,.6);margin-bottom:22px\">Fragen werden geladen …<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ dataReady }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:12px\">\n<sc-for list=\"{{ lfOptions }}\" as=\"l\" hint-placeholder-count=\"15\">\n<button sc-camel-on-click=\"{{ l.onClick }}\" style=\"text-align:left;background:{{ l.bg }};border:1px solid {{ l.bc }};border-radius:11px;padding:11px 13px;color:#f2f2f5;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:background .15s,border-color .15s\" style-hover=\"background:rgba(255,255,255,.1)\">\n<span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:oklch(0.82 0.13 75)\">{{ l.nr }}<\u002Fspan>\n<span style=\"font-size:13px;line-height:1.3\">{{ l.titel }}<\u002Fspan>\n<span style=\"font-size:11.5px;opacity:.5\">{{ l.count }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ pickAll }}\" style=\"width:100%;text-align:left;background:{{ allBg }};border:1px solid {{ allBc }};border-radius:11px;padding:12px 14px;color:#f2f2f5;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:22px;transition:background .15s,border-color .15s\" style-hover=\"background:rgba(255,255,255,.1)\">\n<span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px\">Alle Lernfelder gemischt<\u002Fspan>\n<span style=\"font-size:12px;opacity:.55\">{{ allCount }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-if>\n\n<div style=\"font-size:13.5px;color:rgba(242,242,245,.62);margin-bottom:16px\">Gewählt: <span style=\"color:#f2f2f5;font-weight:600\">{{ lfLabel }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n<input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Dein Vorname\" style=\"flex:1 1 200px;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:15px 16px;color:#f2f2f5;font-family:'IBM Plex Sans',sans-serif;font-size:16px;outline:none\" style-focus=\"border-color:oklch(0.72 0.16 55)\">\n<button sc-camel-on-click=\"{{ start }}\" style=\"flex:0 0 auto;background:oklch(0.72 0.16 55);color:#1a1408;border:none;border-radius:12px;padding:15px 30px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;opacity:{{ readyOpacity }};cursor:{{ readyCursor }}\" style-hover=\"background:oklch(0.78 0.16 55)\">Alleine spielen<\u002Fbutton>\n<button sc-camel-on-click=\"{{ openLobby }}\" style=\"flex:0 0 auto;background:transparent;color:#f2f2f5;border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:15px 26px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;opacity:{{ readyOpacity }};cursor:{{ readyCursor }}\" style-hover=\"background:rgba(255,255,255,.08)\">Raum leiten · Teams<\u002Fbutton>\n<button sc-camel-on-click=\"{{ joinAsGuest }}\" style=\"flex:0 0 auto;background:transparent;color:rgba(242,242,245,.7);border:none;padding:15px 8px;font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;cursor:pointer;text-decoration:underline\" style-hover=\"color:#f2f2f5\">Als Spieler beitreten<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"margin-top:22px;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:13px;color:rgba(242,242,245,.5)\">\n<s erden geladen …<\u002Fdiv>\n<\u002Fsc-if>\n<button sc-camel-on-click=\"{{ leaveLobby }}\" style=\"background:transparent;color:rgba(242,242,245,.6);border:none;padding:15px 8px;font-family:'IBM Plex Sans',sans-serif;font-size:14px;cursor:pointer;text-decoration:underline\" style-hover=\"color:#f2f2f5\">Lobby verlassen<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMonitor }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:100%;max-width:1000px;animation:amqPop .22s ease-out;display:flex;flex-direction:column;gap:18px\">\n<div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between\">\n<div style=\"min-width:0\">\n<div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:6px\">Spielleitung · Live-Übersicht<\u002Fdiv>\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.3px\">{{ lfLabel }}<\u002Fdiv>\n<div style=\"margin-top:4px;font-size:14px;color:rgba(242,242,245,.65)\">{{ doneLabel }}<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ endRound }}\" style=\"flex:0 0 auto;background:oklch(0.72 0.16 55);color:#1a1408;border:none;border-radius:12px;padding:14px 26px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:oklch(0.78 0.16 55)\">Runde beenden · zur Lobby<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ allDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:oklch(0.72 0.16 155 / .15);border:1px solid oklch(0.72 0.16 155 / .5);border-radius:12px;padding:13px 18px;font-size:14.5px\">Alle Spieler sind fertig. Endstand siehe unten – mit „Runde beenden“ geht es zurück in die Lobby.<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:rgba(242,242,245,.6)\">\n<span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:oklch(0.72 0.16 155)\"><\u002Fspan>richtig<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:oklch(0.62 0.20 25)\"><\u002Fspan>falsch<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:oklch(0.78 0.14 75)\"><\u002Fspan>Zeit abgelaufen<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.12)\"><\u002Fspan>offen<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<sc-for list=\"{{ monitorTeams }}\" as=\"t\" hint-placeholder-count=\"2\">\n<div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-left:4px solid {{ t.color }};border-radius:14px;padding:16px 20px\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px\">\n<span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px\">{{ t.rank }} {{ t.name }}<\u002Fspan>\n<span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:oklch(0.80 0.15 75)\">{{ t.scoreLabel }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ t.members }}\" as=\"m\" hint-placeholder-count=\"2\">\n<div style=\"display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) auto;gap:8px 16px;align-items:center\">\n<div style=\"min-width:0\">\n<div style=\"font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis\">{{ m.name }}<\u002Fdiv>\n<div style=\"font-size:12px;color:{{ m.progColor }}\">{{ m.progress }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:4px;min-width:0\">\n<sc-for list=\"{{ m.dots }}\" as=\"d\" hint-placeholder-count=\"10\"><span title=\"{{ d.title }}\" style=\"width:14px;height:14px;border-radius:4px;background:{{ d.bg }}\"><\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"text-align:right\">\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px\">{{ m.score }}<\u002Fdiv>\n<div style=\"font-size:11.5px;color:rgba(242,242,245,.5);white-space:nowrap\">{{ m.tally }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px 20px\">\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-bottom:12px\">Fragenübersicht<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n<sc-for list=\"{{ qStats }}\" as=\"q\" hint-placeholder-count=\"5\">\n<div style=\"display:grid;grid-template-columns:28px minmax(0,1fr) 150px;gap:12px;align-items:center;font-size:13.5px\">\n<span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;opacity:.55\">{{ q.nr }}<\u002Fspan>\n<span style=\"min-width:0;line-height:1.35;color:rgba(242,242,245,.85)\">{{ q.text }}<\u002Fspan>\n<div>\n<div style=\"height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden\"><div style=\"height:100%;width:{{ q.pct }}%;background:{{ q.barColor }}\"><\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:3px;font-size:11.5px;color:rgba(242,242,245,.55)\">{{ q.label }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPlay }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:100%;max-width:1000px;animation:amqPop .22s ease-out\">\n<sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px\">\n<sc-for list=\"{{ standings }}\" as=\"t\" hint-placeholder-count=\"0\"><div style=\"flex:1 1 180px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px\">{{ t.label }}<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:oklch(0.80 0.15 75)\">{{ t.score }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;font-size:13px;color:rgba(242,242,245,.6);margin-bottom:12px\">\n<span style=\"white-space:nowrap\">Frage {{ qNum }} / {{ total }}<\u002Fspan><span>{{ chapter }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:22px\"><div style=\"height:100%;background:oklch(0.72 0.16 55);width:{{ progPct }}%;transition:width .3s ease\"><\u002Fdiv><\u002Fdiv>\n\n<div style=\"background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:30px 30px 26px;margin-bottom:18px\">\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;line-height:1.22;margin:0;letter-spacing:-.4px;text-wrap:pretty\">{{ question }}<\u002Fh2>\n<div style=\"margin-top:22px;display:flex;align-items:center;gap:14px\">\n<div style=\"flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden\"><div style=\"height:100%;background:{{ timeColor }};width:{{ timePct }}%;transition:width .12s linear\"><\u002Fdiv><\u002Fdiv>\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;min-width:34px;text-align:right\">{{ timeLeft }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px\">\n<button sc-camel-on-click=\"{{ pick0 }}\" style=\"position:relative;overflow:hidden;text-align:left;display:flex;align-items:center;gap:16px;background:oklch(0.55 0.18 25);border:none;border-radius:16px;padding:22px 22px;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:17px;line-height:1.35;cursor:pointer;min-height:96px;box-shadow:{{ ring0 }}\" style-hover=\"filter:brightness(1.1)\">\n<span style=\"flex:0 0 26px;width:26px;height:26px;background:#fff;clip-path:polygon(50% 0,100% 100%,0 100%)\"><\u002Fspan><span style=\"flex:1;min-width:0\">{{ o0 }}<\u002Fspan>\n<span style=\"position:absolute;inset:0;background:#101018;opacity:{{ dim0 }};pointer-events:none;transition:opacity .2s\"><\u002Fspan>\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{ pick1 }}\" style=\"position:relative;overflow:hidden;text-align:left;display:flex;align-items:center;gap:16px;background:oklch(0.52 0.15 250);border:none;border-radius:16px;padding:22px 22px;color:#fff;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:17px;line-height:1.35;cursor:pointer;min-height:96px;box-shadow:{{ ring1 }}\" style-hover=\"filter:brightness(1.12)\">\n<span style=\"flex:0 0 26px;width:26px;height:26px;background:#fff;transform:rotate(45deg)\"><\u002Fspan><span style=\"flex:1;min-width:0\">{{ o1 }}<\u002Fspan>\n<span style=\"position:absolute;inset:0;background:#101018;opacity:{{ dim1 }};pointer-events:none;transition:opacity .2s\"><\u002Fspan>\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{ pick2 }}\" style=\"position:relative;overflow:hidden;text-align:left;display:flex;align-items:center;gap:16px;background:oklch(0.58 0.13 165);border:none;border-radius:16px;padding:22px 22px;color:#08150f;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:17px;line-height:1.35;cursor:pointer;min-height:96px;box-shadow:{{ ring2 }}\" style-hover=\"filter:brightness(1.08)\">\n<span style=\"flex:0 0 26px;width:26px;height:26px;background:#08150f;border-radius:50%\"><\u002Fspan><span style=\"flex:1;min-width:0\">{{ o2 }}<\u002Fspan>\n<span style=\"position:absolute;inset:0;background:#101018;opacity:{{ dim2 }};pointer-events:none;transition:opacity .2s\"><\u002Fspan>\n<\u002Fbutton>\n<button sc-camel-on-click=\"{{ pick3 }}\" style=\"position:relative;overflow:hidden;text-align:left;display:flex;align-items:center;gap:16px;background:oklch(0.74 0.15 75);border:none;border-radius:16px;padding:22px 22px;color:#1a1408;font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:17px;line-height:1.35;cursor:pointer;min-height:96px;box-shadow:{{ ring3 }}\" style-hover=\"filter:brightness(1.06)\">\n<span style=\"flex:0 0 26px;width:26px;height:26px;background:#1a1408;border-radius:4px\"><\u002Fspan><span style=\"flex:1;min-width:0\">{{ o3 }}<\u002Fspan>\n<span style=\"position:absolute;inset:0;background:#101018;opacity:{{ dim3 }};pointer-events:none;transition:opacity .2s\"><\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ revealed }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;animation:amqPop .2s ease-out\">\n<div style=\"flex:1 1 380px;min-width:0\">\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:{{ verdictColor }};margin-bottom:6px\">{{ verdict }}<\u002Fdiv>\n<div style=\"font-size:14.5px;line-height:1.5;color:rgba(242,242,245,.72);text-wrap:pretty\">{{ explain }}<\u002Fdiv>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ next }}\" style=\"flex:0 0 auto;background:#f2f2f5;color:#101018;border:none;border-radius:12px;padding:14px 28px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:#fff\">{{ nextLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:100%;max-width:640px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:44px 34px;animation:amqPop .25s ease-out\">\n<div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:12px\">Ergebnis {{ name }}<\u002Fdiv>\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:72px;line-height:1;letter-spacing:-2px;color:oklch(0.78 0.16 55)\">{{ score }}<\u002Fdiv>\n<div style=\"margin-top:10px;font-size:17px;color:rgba(242,242,245,.8)\">{{ correctCount }} von {{ total }} Fragen richtig<\u002Fdiv>\n<div style=\"margin-top:6px;font-size:15px;color:rgba(242,242,245,.55)\">{{ grade }}<\u002Fdiv>\n<sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:26px;display:flex;flex-direction:column;gap:8px;text-align:left\">\n<div style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.55\">Teamwertung<\u002Fdiv>\n<sc-for list=\"{{ standings }}\" as=\"t\" hint-placeholder-count=\"0\"><div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px\"><span style=\"min-width:0\"><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px\">{{ t.label }}<\u002Fspan><span style=\"display:block;font-size:12.5px;color:rgba(242,242,245,.5)\">{{ t.members }}<\u002Fspan><\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:oklch(0.80 0.15 75)\">{{ t.score }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap\">\n<button sc-camel-on-click=\"{{ restart }}\" style=\"background:oklch(0.72 0.16 55);color:#1a1408;border:none;border-radius:12px;padding:14px 28px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:oklch(0.78 0.16 55)\">Nochmal spielen<\u002Fbutton>\n<button sc-camel-on-click=\"{{ toJoin }}\" style=\"background:transparent;color:#f2f2f5;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:14px 24px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.08)\">Zur Startseite<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"width:100%;max-width:1000px;margin-top:auto;padding-top:28px;display:flex;justify-content:flex-end\">\n<button sc-camel-on-click=\"{{ openImpressum }}\" style=\"background:transparent;border:none;padding:4px 2px;color:rgba(242,242,245,.35);font-family:'IBM Plex Sans',sans-serif;font-size:11px;cursor:pointer;text-decoration:underline\" style-hover=\"color:rgba(242,242,245,.7)\">Impressum<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ impressumOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;background:rgba(10,10,16,.72);display:flex;align-items:flex-start;justify-content:center;padding:28px 18px;overflow:auto;z-index:60\">\n<div style=\"width:100%;max-width:720px;background:#16161f;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:32px 34px 36px;box-shadow:0 24px 60px rgba(0,0,0,.5)\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px\">\n<h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0;letter-spacing:-.3px\">Impressum<\u002Fh2>\n<button sc-camel-on-click=\"{{ closeImpressum }}\" style=\"flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 14px;color:#f2f2f5;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.16)\">Schließen<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6;color:rgba(242,242,245,.78);display:flex;flex-direction:column;gap:16px;text-wrap:pretty\">\n<p style=\"margin:0\">Diese Anwendung ist ein nichtkommerzielles Unterrichtsmaterial für den Einsatz im Fachunterricht Anlagenmechaniker SHK an den Berufsbildenden Schulen Ammerland.<\u002Fp>\n<div>\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:#f2f2f5;margin-bottom:4px\">Verantwortlich für den Inhalt:<\u002Fdiv>\n<p style=\"margin:0\">Christian Hamjediers, Lehrkraft<br>Berufsbildende Schulen Ammerland<br>Elmendorfer Straße 59, 26160 Bad Zwischenahn<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#f2f2f5;margin-bottom:5px\">Hinweis zur Nutzung<\u002Fdiv>\n<p style=\"margin:0\">Die Anwendung dient ausschließlich der Wiederholung und Übung im Unterricht. Die Fragen wurden sorgfältig erstellt, können aber Fehler enthalten und von Fachbüchern oder aktuellen Normen abweichen. Maßgeblich sind die im Unterricht verwendeten Lehrmaterialien, die geltenden Regelwerke und die Hinweise der Lehrkraft. Eine Gewähr für die Richtigkeit, Vollständigkeit und Aktualität der Inhalte wird nicht übernommen. Die Ergebnisse im Quiz haben keinen Einfluss auf die Leistungsbewertung.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#f2f2f5;margin-bottom:5px\">Datenschutzhinweis<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div>\n<div style=\"font-weight:600;color:rgba(242,242,245,.92)\">Welche Daten werden verarbeitet?<\u002Fdiv>\n<p style=\"margin:0\">Zur Teilnahme wird ein Spielname eingegeben. Trage dort nur deinen Vornamen ein – keinen Nachnamen; ein Fantasiename oder Spitzname ist ebenfalls möglich. Verarbeitet werden nur der Spielname, die Teamzuordnung und der Punktestand während des Spiels. Es gibt keine Registrierung, kein Tracking und keine Werbung.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight:600;color:rgba(242,242,245,.92)\">Wofür?<\u002Fdiv>\n<p style=\"margin:0\">Die Daten werden ausschließlich benötigt, um das Quiz gemeinsam auf mehreren Geräten zu spielen (Anzeige von Teams und Punkteständen).<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight:600;color:rgba(242,242,245,.92)\">Wo werden die Daten gespeichert?<\u002Fdiv>\n<p style=\"margin:0 0 6px\">Die Webseite wird über GitHub Pages (GitHub Inc., USA) bereitgestellt. Beim Aufruf verarbeitet GitHub technisch notwendige Daten wie die IP-Adresse.<\u002Fp>\n<p style=\"margin:0\">Die Live-Synchronisation erfolgt über Google Firebase (Google Ireland Ltd.; Datenbankstandort: Europa). Dabei wird eine anonyme Kennung ohne Personenbezug erzeugt. Eine Übermittlung von Daten in die USA kann nicht ausgeschlossen werden.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight:600;color:rgba(242,242,245,.92)\">Wie lange?<\u002Fdiv>\n<p style=\"margin:0\">Die Spieldaten werden nach Ende der Unterrichtsstunde von der Lehrkraft gelöscht (Funktion „Lobby leeren“). Es findet keine dauerhafte Speicherung statt.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight:600;color:rgba(242,242,245,.92)\">Rechtsgrundlage:<\u002Fdiv>\n<p style=\"margin:0\">Art. 6 Abs. 1 lit. e DSGVO in Verbindung mit § 31 Niedersächsisches Schulgesetz (Verarbeitung im Rahmen des Bildungsauftrags der Schule).<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight:600;color:rgba(242,242,245,.92)\">Deine Rechte:<\u002Fdiv>\n<p style=\"margin:0\">Du hast das Recht auf Auskunft, Berichtigung, Löschung und Einschränkung der Verarbeitung deiner Daten. Wende dich dazu an die oben genannte Lehrkraft oder an die Datenschutzbeauftragte bzw. den Datenschutzbeauftragten der Schule: [Name/Kontakt]. Außerdem kannst du dich bei der Landesbeauftragten für den Datenschutz Niedersachsen beschweren.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;questionCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:5,&quot;max&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Quiz&quot;},&quot;timerSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:25,&quot;min&quot;:10,&quot;max&quot;:60,&quot;step&quot;:5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Quiz&quot;},&quot;shuffleQuestions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Quiz&quot;}}\">\nconst LKEY = 'amq-lobby-v1';\nconst TOPIC = 'amq_tw54_quiz';\nconst ROOM = 'TW54';\n\nconst BROKERS = ['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];\nconst TEAM_NAMES = ['Team 1','Team 2','Team 3','Team 4'];\nconst MAX_PER_TEAM = 4;\nfunction lread(key){ try { return JSON.parse(localStorage.getItem(key || LKEY) || '{}') || {}; } catch(e){ return {}; } }\nfunction lwrite(next, key){ try { localStorage.setItem(key || LKEY, JSON.stringify(next)); } catch(e){} }\nfunction lfList(){ const d = (typeof window!=='undefined') ? window.FRAGEN : null; return (d && d.lernfelder) ? d.lernfelder : []; }\nfunction poolFor(nr){\n  const sel = nr==='all' ? lfList() : lfList().filter(x=>x.nr===nr);\n  const out = [];\n  sel.forEach(lf=>{ (lf.fragen||[]).forEach(f=>{\n    out.push({c:'LF '+lf.nr+' · '+(f.thema||lf.titel), q:f.frage, o:f.antworten, a:f.korrekt, e:f.erklaerung});\n  }); });\n  return out;\n}\nfunction mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }\n\nclass Component extends DCLogic {\n  state = {screen:'join', idx:0, score:0, streak:0, picked:null, t:0, deck:[], correct:0, name:'', best:0, url:'', mode:'solo', myId:'', players:{}, seed:0, room:'', roomInput:'', conn:'off', lf:null};\n  qrRef = React.createRef();\n  lobbyQrRef = React.createRef();\n  netPlayers = {};\n  netGame = null;\n\n  componentDidMount(){\n    let best = 0;\n    try { best = parseInt(localStorage.getItem('amq-best')||'0',10)||0; } catch(e){}\n    const url = (typeof location!=='undefined') ? location.href.split('#')[0] : '';\n    const myId = 'p' + Math.random().toString(36).slice(2,9);\n    const hash = (typeof location!=='undefined') ? location.hash : '';\n    const auto = /(^|[#&])join($|[&=])/i.test(hash||'') || /r=/i.test(hash||'');\n    this.setState({best, url, myId}, ()=>{\n      this.drawQr();\n      if(auto) this.enterRoom(ROOM, false);\n    });\n    try { this._ch = new BroadcastChannel('amq-lobby'); this._ch.onmessage = ()=>this.syncLobby(); } catch(e){}\n    this._onStorage = e => { if(!e || e.key===LKEY) this.syncLobby(); };\n    window.addEventListener('storage', this._onStorage);\n    this._poll = setInterval(()=>{ this.heartbeat(); this.syncLobby(); }, 1800);\n    this.awaitQuestions();\n  }\n  awaitQuestions(){\n    if(lfList().length){ this.setState({dataReady:true}); return; }\n    let tries = 0;\n    import('./fragen.js').then(m=>{\n      const d = m.FRAGEN || m.default;\n      if(d && d.lernfelder && !window.FRAGEN) window.FRAGEN = d;\n      if(lfList().length){ clearInterval(this._dataPoll); this.setState({dataReady:true}); }\n    }).catch(()=>{});\n    this._dataPoll = setInterval(()=>{\n      tries++;\n      if(lfList().length){ clearInterval(this._dataPoll); this.setState({dataReady:true}); }\n      else if(tries > 120) clearInterval(this._dataPoll);\n      else this.forceUpdate();\n    }, 120);\n  }\n  componentDidUpdate(){ this.drawQr(); }\n\n  /* ---- Transport: öffentlicher MQTT-Broker, Fallback = lokaler Speicher ---- */\n  topic(sub){ return TOPIC + '/' + this.state.room + (sub ? '/' + sub : ''); }\n  lk(){ return this.state.room ? LKEY + ':' + this.state.room : LKEY; }\n  async fbConfig(){\n    if(this._cfg !== undefined) return this._cfg;\n    let c = (typeof window !== 'undefined' && window.AMQ_FIREBASE) ? window.AMQ_FIREBASE : null;\n    if(!c){\n      try {\n        const m = await import('./firebase-config.js');\n        c = m.firebaseConfig || m.default || m.FIREBASE || null;\n      } catch(e){ c = null; }\n    }\n    this._cfg = (c && c.databaseURL) ? c : null;\n    return this._cfg;\n  }\n  loadScript(src){\n    return new Promise(res=>{\n      if(document.querySelector('script[data-amq=\"'+src+'\"]')) return res(true);\n      const s = document.createElement('script');\n      s.src = src; s.dataset.amq = src;\n      s.onload = ()=>res(true); s.onerror = ()=>res(false);\n      document.head.appendChild(s);\n    });\n  }\n  async connectFirebase(room){\n    try {\n      const cfg = await this.fbConfig();\n      if(!cfg) return false;\n      if(!window.firebase || !window.firebase.database){\n        const base = 'https://www.gstatic.com/firebasejs/10.12.2/';\n        const ok = await Promise.all([\n          this.loadScript(base + 'firebase-app-compat.js'),\n          this.loadScript(base + 'firebase-auth-compat.js'),\n          this.loadScript(base + 'firebase-database-compat.js')\n        ]);\n        if(ok.some(x=>!x) || !window.firebase) return false;\n      }\n      if(!window.firebase.apps.length) window.firebase.initializeApp(cfg);\n      try { await window.firebase.auth().signInAnonymously(); } catch(e){ return false; }\n      const uid = (window.firebase.auth().currentUser||{}).uid;\n      if(uid) this.setState({myId: uid});\n      const db = window.firebase.database();\n      const ref = db.ref('rooms/' + room);\n      const meId = uid || this.state.myId;\n      this._fb = {ref, me: ref.child('players/' + meId)};\n      try { await this._fb.me.onDisconnect().remove(); } catch(e){}\n      if(this.state.isHost){ try { await ref.child('game').remove(); } catch(e){} }\n      ref.on('value', snap=>{\n        const v = snap.val() || {};\n        this.netPlayers = {};\n        Object.keys(v.players||{}).forEach(id=>{ this.netPlayers[id] = Object.assign({id}, v.players[id]); });\n        const rst = v.reset && v.reset.at;\n        if(rst && rst > (this._resetAt||0)){ this.applyReset(rst); return; }\n        if(v.end && v.end.at > (this._gameStartAt||0) && this.state.screen==='play') this.forceEnd();\n        this.netGame = (v.game && (v.game.at||0) >= (this._resetAt||0)) ? v.game : null;\n        this.syncLobby();\n      }, ()=>{ this.setState({conn:'local'}); });\n      db.ref('.info/connected').on('value', s=>{\n        this.setState({conn: s.val() ? 'online' : 'connecting'});\n        if(s.val()) this.publishMe();\n      });\n      return true;\n    } catch(e){ return false; }\n  }\n  applyReset(at){\n    this._resetAt = at; this._lobbyAt = at;\n    this.netPlayers = {}; this.netGame = null; this._anyGame = null;\n    if(this.state.isHost) this.clearRetained('game');\n    const st = lread(this.lk()); if(st.players) delete st.players[this.state.myId];\n    st.game = null; lwrite(st, this.lk()); this.ping();\n    clearInterval(this._iv);\n    this.setState({players:{}, seed:0, score:0, correct:0, picked:null, screen:'lobby'});\n  }\n  async connect(room){\n    this.closeNet();\n    this.netPlayers = {}; this.netGame = null;\n    this.setState({conn:'connecting'});\n    if(await this.connectFirebase(room)) return;\n    if(!window.mqtt){ this.setState({conn:'local'}); return; }\n    this.setState({conn:'connecting'});\n    const attempt = i => {\n      if(i >= BROKERS.length){ this.setState({conn:'local'}); return; }\n      let live = false, c;\n      try {\n        c = window.mqtt.connect(BROKERS[i], {clientId:'amq_'+this.state.myId+'_'+Math.random().toString(36).slice(2,6), clean:true, keepalive:30, connectTimeout:6000, reconnectPeriod:0});\n      } catch(e){ attempt(i+1); return; }\n      c.on('connect', ()=>{\n        live = true; this._net = c;\n        this.setState({conn:'online'});\n        c.subscribe(TOPIC + '/' + room + '/#', {qos:0});\n        if(this.state.isHost){\n          this._anyGame = null; this.netGame = null;\n          this.clearRetained('game');\n          this.setState({gameRunning:false});\n        }\n        this.publishMe();\n      });\n      c.on('message', (t, payload)=>{\n          const raw = payload.toString();\n        if(!raw){ if(/\\/game$/.test(t)){ this.netGame = null; this._anyGame = null; this.syncLobby(); } return; }\n        let d = null; try { d = JSON.parse(raw); } catch(e){ return; }\n        if(/\\/reset$/.test(t)){ if(d && d.at > (this._resetAt||0)) this.applyReset(d.at); return; }\n        if(/\\/end$/.test(t)){ if(d && d.at > (this._gameStartAt||0) && this.state.screen==='play') this.forceEnd(); return; }\n        if(/\\/game$/.test(t)){ if(d && (d.at||0) >= (this._resetAt||0)){ this.netGame = d; this._anyGame = d; } }\n        else if(d && d.id){ if((d.ts||0) < (this._resetAt||0)) return; this.netPlayers[d.id] = d; }\n        this.syncLobby();\n      });\n      c.on('error', ()=>{ try{ c.end(true); }catch(e){} if(!live) attempt(i+1); else if(this._net===c){ this._net = null; this.setState({conn:'connecting'}); } });\n      c.on('close', ()=>{\n        if(!live) attempt(i+1);\n        else if(this._net===c){ this._net = null; this.setState({conn:'connecting'}); }\n      });\n    };\n    this._attempt = attempt;\n    attempt(0);\n    clearInterval(this._retryNet);\n    this._retryNet = setInterval(()=>{\n      const s = this.state;\n      if(s.mode!=='team' || (s.screen!=='lobby' && s.screen!=='play' && s.screen!=='done')){ return; }\n      if(s.conn==='online' && this._net) return;\n      if(this._fb) return;\n      this._attempt && this._attempt(0);\n    }, 8000);\n  }\n  reconnect = ()=>{ this.setState({conn:'connecting'}, ()=>this.connect(this.state.room)); };\n  closeNet(){\n    clearInterval(this._retryNet);\n    try { if(this._net){ this._net.end(true); this._net = null; } } catch(e){}\n    try { if(this._fb){ this._fb.ref.off(); this._fb.me.remove(); this._fb = null; } } catch(e){}\n  }\n  pub(sub, data){\n    try { if(this._fb) this._fb.ref.child(sub.indexOf('p/')===0 ? 'players/'+sub.slice(2) : sub).set(data); } catch(e){}\n    try { if(this._net) this._net.publish(this.topic(sub), JSON.stringify(data), {qos:0, retain:true}); } catch(e){}\n  }\n  clearRetained(sub){\n    try { if(this._net) this._net.publish(this.topic(sub), '', {qos:0, retain:true}); } catch(e){}\n  }\n  forceEnd(){\n    clearInterval(this._iv);\n    this.setState({screen:'done'}, ()=>this.publishMe());\n  }\n  publishMe(){\n    const me = (lread(this.lk()).players||{})[this.state.myId];\n    if(!me) return;\n    const s = this.state;\n    const inGame = s.screen==='play' || s.screen==='done';\n    const rec = Object.assign({id:s.myId}, me, {score:s.score||0, ts:Date.now(),\n      idx: inGame ? s.idx : 0, hist: inGame ? (s.hist||[]) : [], done: s.screen==='done', seed: s.seed||0});\n    this.netPlayers[this.state.myId] = rec;\n    this.pub('p/'+this.state.myId, rec);\n  }\n\n  ping(){ try { if(this._ch) this._ch.postMessage(1); } catch(e){} }\n  mutate(fn){ const st = lread(this.lk()); const next = fn(st) || st; lwrite(next, this.lk()); this.ping(); this.syncLobby(); }\n  heartbeat(){\n    if(this.state.mode!=='team' || !this.state.myId) return;\n    const me = (lread(this.lk()).players||{})[this.state.myId];\n    if(!me) return;\n    this.mutate(st=>{ st.players = st.players||{}; if(st.players[this.state.myId]){ st.players[this.state.myId].ts = Date.now(); st.players[this.state.myId].score = this.state.score; } return st; });\n    this.publishMe();\n  }\n  syncLobby(){\n    const st = lread(this.lk()); const now = Date.now();\n    const merged = {};\n    Object.keys(this.netPlayers).forEach(id=>{ merged[id] = this.netPlayers[id]; });\n    Object.keys(st.players||{}).forEach(id=>{ merged[id] = Object.assign({}, merged[id], st.players[id], {id}); });\n    const players = {};\n    Object.keys(merged).forEach(id=>{ const p = merged[id]; if(p && p.team!=null && now - (p.ts||0) < 12000) players[id] = p; });\n    this.setState({players});\n    const any = [st.game, this._anyGame].filter(g=>g && g.seed).sort((a,b)=>(b.at||0)-(a.at||0))[0];\n    const running = !!(any && (any.at||0) <= (this._lobbyAt||0) && now - (any.at||0) < 1800000);\n    if(running !== this.state.gameRunning) this.setState({gameRunning:running});\n    const games = [st.game, this.netGame].filter(g=>g && g.seed && (g.at||0) > (this._lobbyAt||0) && now - (g.at||0) < 45000);\n    const game = games.sort((a,b)=>(b.at||0)-(a.at||0))[0];\n    if(game && game.seed !== this.state.seed && this.state.screen==='lobby' && players[this.state.myId]){\n      const lf = (game.lf === 'all' || typeof game.lf === 'number') ? game.lf : this.state.lf;\n      this.setState({lf}, ()=>this.beginGame(game.seed));\n    }\n  }\n\n  enterRoom(room, isHost){\n    this._resetAt = 0;\n    this._lobbyAt = Date.now();\n    this.netGame = null;\n    if(isHost) this._anyGame = null;\n    if(isHost) lwrite({players:{}}, LKEY + ':' + room);\n    else { const st = lread(LKEY + ':' + room); st.game = null; lwrite(st, LKEY + ':' + room); }\n    this.setState({mode:'team', screen:'lobby', room, roomInput:room, score:0, correct:0, seed:0, players:{}, isHost:!!isHost}, ()=>this.connect(room));\n  }\n  joinAsGuest = ()=>{ this.enterRoom(ROOM, false); };\n  backToLobby = ()=>{\n    this._lobbyAt = Date.now();\n    this.netGame = null;\n    const st = lread(this.lk()); st.game = null; lwrite(st, this.lk());\n    if(this.state.isHost){\n      this._anyGame = null;\n      this.clearRetained('game');\n      try { if(this._fb) this._fb.ref.child('game').remove(); } catch(e){}\n    }\n    this.setState({screen:'lobby', seed:0, score:0, correct:0, picked:null, gameRunning:false});\n  };\n  joinTeam = t => ()=>{\n    if(this.state.isHost) return;\n    const name = (this.state.name||'').trim();\n    if(!name) return;\n    const p = this.state.players || {};\n    const inTeam = Object.keys(p).filter(id=>p[id].team===t && id!==this.state.myId).length;\n    if(inTeam >= MAX_PER_TEAM) return;\n    this.mutate(s=>{ s.players = s.players||{}; s.players[this.state.myId] = {name, team:t, score:this.state.score||0, ts:Date.now()}; return s; });\n    this.publishMe();\n  };\n  leaveLobby = ()=>{\n    this.clearRetained('p/'+this.state.myId);\n    if(this.state.isHost){ this.clearRetained('game'); this._anyGame = null; }\n    this.pub('p/'+this.state.myId, {id:this.state.myId, team:null, ts:0});\n    this.mutate(s=>{ if(s.players) delete s.players[this.state.myId]; return s; });\n    this.closeNet();\n    clearInterval(this._iv);\n    this.netPlayers = {}; this.netGame = null;\n    this.setState({screen:'join', mode:'solo', seed:0, room:'', conn:'off', players:{}});\n  };\n  openLobby = ()=>{ if(this.state.lf == null) return; this.enterRoom(ROOM, true); };\n  resetLobby = ()=>{\n    if(!this.state.isHost) return;\n    const at = Date.now();\n    this.pub('reset', {at});\n    this.applyReset(at);\n  };\n  startTeamGame = ()=>{\n    if(this.state.mode==='team' && !this.state.isHost) return;\n    if(!this.pool.length || !Object.keys(this.state.players||{}).length) return;\n    const seed = Date.now() % 2147483647;\n    const game = {seed, at:Date.now(), lf:this.state.lf};\n    this.netGame = game;\n    this.clearRetained('end');\n    try { if(this._fb) this._fb.ref.child('end').remove(); } catch(e){}\n    this.mutate(s=>{ s.game = game; if(s.players) delete s.players[this.state.myId]; return s; });\n    this.pub('game', game);\n    this._gameStartAt = game.at;\n    this.setState({screen:'monitor', seed, deck:this.buildDeck(seed), idx:0, score:0, correct:0, picked:null});\n  };\n  endRound = ()=>{\n    if(!this.state.isHost) return;\n    const at = Date.now();\n    this.pub('end', {at});\n    this.backToLobby();\n  };\n  beginGame(seed){\n    if(!this.pool.length){\n      this.setState({screen:'lobby'});\n      if(!this._retry){ this._retry = setTimeout(()=>{ this._retry = null; if(this.state.screen==='lobby') this.beginGame(seed); }, 500); }\n      return;\n    }\n    clearTimeout(this._retry); this._retry = null;\n    this._gameStartAt = Date.now();\n    this.setState({screen:'play', seed, deck:this.buildDeck(seed), idx:0, score:0, streak:0, correct:0, picked:null, hist:[]}, ()=>{ this.tick(); this.publishMe(); });\n    this.mutate(s=>{ if(s.players && s.players[this.state.myId]){ s.players[this.state.myId].score = 0; s.players[this.state.myId].ts = Date.now(); } return s; });\n  }\n  drawQr(){\n    const pairs = [[this.qrRef.current, this.state.url], [this.lobbyQrRef.current, this.roomLink()]];\n    pairs.forEach(([c, value])=>{\n      if(!c || !window.QRious || !value || c.dataset.done === value) return;\n      c.dataset.done = value;\n      try { new window.QRious({element:c, value, size:220, padding:6, background:'#ffffff', foreground:'#101018', level:'M'}); } catch(e){}\n    });\n  }\n  roomLink(){ return this.state.url ? (this.state.url + '#join') : ''; }\n  componentWillUnmount(){\n    clearInterval(this._iv); clearInterval(this._poll); clearInterval(this._dataPoll);\n    clearInterval(this._retryNet); clearTimeout(this._retry); this.closeNet();\n    window.removeEventListener('storage', this._onStorage);\n    try { if(this._ch) this._ch.close(); } catch(e){}\n  }\n\n  get secs(){ return Math.round(this.props.timerSeconds ?? 25); }\n  get pool(){ return poolFor(this.state.lf); }\n  get count(){ return Math.max(1, Math.min(Math.round(this.props.questionCount ?? 20), this.pool.length)); }\n\n  shuffle(a, rnd){ const r=a.slice(); const f = rnd || Math.random; for(let i=r.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }\n\n  buildDeck(seed){\n    const rnd = seed ? mulberry32(seed) : null;\n    const all = this.pool;\n    const picked = (this.props.shuffleQuestions ?? true) ? this.shuffle(all, rnd) : all.slice();\n    return picked.slice(0, this.count).map(item=>{\n      const idxs = this.shuffle([0,1,2,3], rnd);\n      return {c:item.c, q:item.q, e:item.e, o:idxs.map(i=>item.o[i]), a:idxs.indexOf(item.a)};\n    });\n  }\n\n  start = ()=>{\n    if(this.state.lf == null || !this.pool.length) return;\n    this.setState({mode:'solo', screen:'play', deck:this.buildDeck(), idx:0, score:0, streak:0, correct:0, picked:null}, this.tick);\n  };\n  pickLf = nr => ()=>{ if(lfList().length) this.setState({lf:nr}); };\n  tick = ()=>{\n    clearInterval(this._iv);\n    this._deadline = Date.now() + this.secs*1000;\n    this.setState({t:this.secs*10, picked:null});\n    this._iv = setInterval(()=>{\n      if(this.state.picked !== null){ clearInterval(this._iv); return; }\n      const left = Math.max(0, this._deadline - Date.now());\n      if(left <= 0){ clearInterval(this._iv); this.setState(s=>({t:0, picked:-1, streak:0, hist:(s.hist||[]).concat(-1)}), ()=>{ if(this.state.mode==='team') this.heartbeat(); }); }\n      else this.setState({t: Math.ceil(left/100)});\n    },100);\n  };\n  answer = i => ()=>{\n    if(this.state.picked!==null) return;\n    clearInterval(this._iv);\n    const q = this.state.deck[this.state.idx];\n    const ok = i===q.a;\n    this.setState(s=>{\n      const streak = ok ? s.streak+1 : 0;\n      const pts = ok ? Math.round(600 + 400*(s.t/(this.secs*10))) + Math.min(streak-1,5)*50 : 0;\n      return {picked:i, streak, score:s.score+pts, correct:s.correct+(ok?1:0), gain:pts, hist:(s.hist||[]).concat(ok?1:0)};\n    });\n    if(this.state.mode==='team') setTimeout(()=>this.heartbeat(), 30);\n  };\n  next = ()=>{\n    if(this.state.idx+1 >= this.state.deck.length){\n      const best = Math.max(this.state.best, this.state.score);\n      try { localStorage.setItem('amq-best', String(best)); } catch(e){}\n      this.setState({screen:'done', best}, ()=>{ if(this.state.mode==='team') this.heartbeat(); });\n    } else {\n      this.setState(s=>({idx:s.idx+1}), this.tick);\n    }\n  };\n\n  monitorVals(T){\n    const s = this.state, deck = s.deck||[], n = deck.length;\n    const colors = ['oklch(0.55 0.18 25)','oklch(0.52 0.15 250)','oklch(0.58 0.13 165)','oklch(0.74 0.15 75)'];\n    const dotBg = v => v===1 ? 'oklch(0.72 0.16 155)' : v===0 ? 'oklch(0.62 0.20 25)' : v===-1 ? 'oklch(0.78 0.14 75)' : 'rgba(255,255,255,.12)';\n    const all = [];\n    const teams = [0,1,2,3].map(t=>{\n      const ids = Object.keys(s.players||{}).filter(id=>s.players[id].team===t);\n      const members = ids.map(id=>{\n        const p = s.players[id];\n        const cur = p.seed===s.seed;\n        const hist = cur ? (p.hist||[]) : [];\n        all.push({hist, done: cur && !!p.done});\n        const right = hist.filter(v=>v===1).length;\n        return {\n          name: p.name, score: cur ? (p.score||0) : 0,\n          progress: (cur && p.done) ? 'Fertig' : ('Frage ' + Math.min(hist.length+1, n) + ' / ' + n),\n          tally: right + ' richtig · ' + (hist.length-right) + ' falsch',\n          progColor: (cur && p.done) ? 'oklch(0.80 0.15 160)' : 'rgba(242,242,245,.6)',\n          dots: Array.from({length:n}, (_,i)=>({bg: dotBg(hist[i]), title: 'Frage '+(i+1)+': '+(hist[i]===1?'richtig':hist[i]===0?'falsch':hist[i]===-1?'Zeit abgelaufen':'offen')}))\n        };\n      });\n      return {name:TEAM_NAMES[t], color:colors[t], members, score:members.reduce((a,m)=>a+m.score,0), count:members.length};\n    }).filter(t=>t.count).sort((a,b)=>b.score-a.score).map((t,i)=>Object.assign(t,{rank:(i+1)+'.', scoreLabel:t.score+' Pkt.'}));\n    const qStats = deck.map((q,i)=>{\n      const answered = all.filter(a=>a.hist.length>i);\n      const ok = answered.filter(a=>a.hist[i]===1).length;\n      const pct = answered.length ? Math.round(ok/answered.length*100) : 0;\n      return {nr:String(i+1), text:q.q, label: answered.length ? (ok+' / '+answered.length+' richtig') : 'noch offen', pct, barColor: pct>=70 ? 'oklch(0.72 0.16 155)' : pct>=40 ? 'oklch(0.78 0.14 75)' : 'oklch(0.62 0.20 25)'};\n    });\n    const doneCount = all.filter(a=>a.done).length;\n    return {\n      monitorTeams: teams, qStats,\n      doneLabel: doneCount + ' von ' + all.length + ' Spielern fertig',\n      allDone: all.length>0 && doneCount===all.length,\n      noPlayers: all.length===0\n    };\n  }\n  renderVals(){\n    const s = this.state, q = s.deck[s.idx];\n    const revealed = s.picked !== null;\n    const ok = revealed && s.picked === (q && q.a);\n    const total = this.count;\n    const ringOf = i => (revealed && q && i===q.a) ? '0 0 0 4px #f2f2f5' : 'none';\n    const dimOf = i => (revealed && q && i!==q.a && i!==s.picked) ? 0.55 : 0;\n    const grade = s.correct/total >= 0.9 ? 'Sehr gut – prüfungsreif.' : s.correct/total >= 0.7 ? 'Gut. Ein paar Regelwerte noch einmal ansehen.' : s.correct/total >= 0.5 ? 'Solide Basis, Kapitel 5.4 nochmal durcharbeiten.' : 'Noch viel Luft – Musterlösung wiederholen.';\n    const ids = Object.keys(s.players||{});\n    const teamOf = t => ids.filter(id=>s.players[id].team===t).map(id=>({name:s.players[id].name, score:s.players[id].score||0, me: id===s.myId}));\n    const T = [0,1,2,3].map(t=>{ const m = teamOf(t); return {name:TEAM_NAMES[t], members:m, score:m.reduce((a,b)=>a+b.score,0), count:m.length}; });\n    const standings = T.filter(t=>t.count>0).slice().sort((a,b)=>b.score-a.score).map((t,i)=>({label:(i+1)+'. '+t.name, score:t.score, members:t.members.map(m=>m.name).join(', ')}));\n    const mine = (s.players||{})[s.myId];\n    const nameOk = !!(s.name||'').trim();\n    return {\n      isJoin: s.screen==='join', isPlay: s.screen==='play', isDone: s.screen==='done',\n      isLobby: s.screen==='lobby', isTeam: s.mode==='team', openLobby: this.openLobby,\n      leaveLobby: this.leaveLobby, resetLobby: this.resetLobby, startTeamGame: this.startTeamGame,\n      lobbyQrRef: this.lobbyQrRef, nameOk, playerTotal: ids.length,\n      room: s.room, roomLink: this.roomLink(), joinAsGuest: this.joinAsGuest,\n      lfOptions: lfList().map(l=>({\n        nr:'LF '+l.nr, titel:l.titel, count:(l.fragen||[]).length+' Fragen',\n        bg: s.lf===l.nr ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.04)',\n        bc: s.lf===l.nr ? 'oklch(0.72 0.16 55)' : 'rgba(255,255,255,.12)',\n        onClick: this.pickLf(l.nr)\n      })),\n      allBg: s.lf==='all' ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.04)',\n      allBc: s.lf==='all' ? 'oklch(0.72 0.16 55)' : 'rgba(255,255,255,.12)',\n      pickAll: this.pickLf('all'),\n      allCount: poolFor('all').length + ' Fragen',\n      lfChosen: s.lf != null,\n      dataReady: !!lfList().length,\n      dataWaiting: !lfList().length,\n      readyOpacity: (s.lf != null && this.pool.length) ? 1 : 0.42,\n      readyCursor: (s.lf != null && this.pool.length) ? 'pointer' : 'not-allowed',\n      lfLabel: s.lf === 'all' ? 'Alle Lernfelder' : (s.lf != null ? ('LF ' + s.lf + ' · ' + ((lfList().find(l=>l.nr===s.lf)||{}).titel||'')) : 'Noch kein Lernfeld gewählt'),\n      poolSize: this.pool.length,\n      wanted: Math.round(this.props.questionCount ?? 20),\n      connLabel: s.conn==='online' ? 'Online verbunden' : s.conn==='connecting' ? 'Verbinde…' : 'Offline – nur dieses Gerät',\n      connColor: s.conn==='online' ? 'oklch(0.80 0.15 160)' : s.conn==='connecting' ? 'oklch(0.80 0.15 75)' : 'oklch(0.72 0.17 30)',\n      myTeamName: mine && mine.team!=null ? TEAM_NAMES[mine.team] : '—',\n      canStart: ids.length>0 && !!mine && mine.team!=null,\n      isMonitor: s.screen==='monitor', endRound: this.endRound,\n      ...this.monitorVals(T),\n      isHost: !!s.isHost, isGuest: !s.isHost && !s.gameRunning,\n      gameRunning: !s.isHost && !!s.gameRunning,\n      dataLoading: !s.isHost && !lfList().length,\n      offline: s.conn==='local', reconnect: this.reconnect,\n      impressumOpen: !!s.impressum,\n      openImpressum: ()=>this.setState({impressum:true}),\n      closeImpressum: ()=>this.setState({impressum:false}),\n      lobbyHint: s.isHost ? 'Du leitest den Raum und spielst nicht mit. Nach dem Start siehst du live, bei welcher Frage die Spieler sind und was richtig oder falsch beantwortet wurde.' : !nameOk ? 'Zuerst nur den Vornamen eingeben, dann ein Team wählen.' : (mine && mine.team!=null ? (s.isHost ? 'Du bist in '+TEAM_NAMES[mine.team]+' und leitest den Raum. Starte das Quiz, wenn alle bereit sind.' : 'Du bist in '+TEAM_NAMES[mine.team]+'. Das Quiz wird von der Spielleitung gestartet.') : 'Wähle ein Team – maximal 4 Spieler pro Team.'),\n      t0: T[0].members, t1: T[1].members, t2: T[2].members, t3: T[3].members,\n      c0: T[0].count+'/4', c1: T[1].count+'/4', c2: T[2].count+'/4', c3: T[3].count+'/4',\n      join0: this.joinTeam(0), join1: this.joinTeam(1), join2: this.joinTeam(2), join3: this.joinTeam(3),\n      standings,\n      score: s.score, total, secs: this.secs, best: s.best, url: s.url, qrRef: this.qrRef,\n      name: s.name, onName: e=>this.setState({name:e.target.value}),\n      start: this.start, restart: s.mode==='team' ? this.backToLobby : this.start,\n      toJoin: s.mode==='team' ? this.leaveLobby : ()=>this.setState({screen:'join'}),\n      qNum: s.idx+1, progPct: Math.round(((s.idx + (revealed?1:0))/total)*100),\n      chapter: q ? q.c : '', question: q ? q.q : '',\n      o0: q?q.o[0]:'', o1: q?q.o[1]:'', o2: q?q.o[2]:'', o3: q?q.o[3]:'',\n      pick0: this.answer(0), pick1: this.answer(1), pick2: this.answer(2), pick3: this.answer(3),\n      ring0: ringOf(0), ring1: ringOf(1), ring2: ringOf(2), ring3: ringOf(3),\n      dim0: dimOf(0), dim1: dimOf(1), dim2: dimOf(2), dim3: dimOf(3),\n      timeLeft: Math.ceil(s.t/10), timePct: Math.round((s.t/(this.secs*10))*100),\n      timeColor: s.t <= this.secs*3 ? 'oklch(0.62 0.20 25)' : 'oklch(0.78 0.16 55)',\n      revealed,\n      verdict: s.picked===-1 ? 'Zeit abgelaufen' : ok ? ('Richtig · +' + (s.gain||0) + ' Punkte') : 'Leider falsch',\n      verdictColor: ok ? 'oklch(0.80 0.15 160)' : 'oklch(0.72 0.17 30)',\n      explain: q ? q.e : '',\n      nextLabel: s.idx+1 >= total ? 'Ergebnis' : 'Weiter',\n      next: this.next, correctCount: s.correct, grade\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
